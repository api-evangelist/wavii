name: Wavii
description: Wavii was a Seattle-based startup founded in 2008 by Adrian Aoun that
  built a news-summarization app using natural-language-processing and machine-learning
  to convert web content (news articles and blogs) into short structured story summaries.
  Backed by Battery Ventures, Felicis Ventures and Kapor Capital, Wavii was acquired
  by Google in April 2013 (reported at over $30M) and immediately shut down its
  consumer service, with the team moving to Google to work on natural-language
  products. The company is defunct and operates no public product or API. This
  profile was surfaced as a Battery Ventures portfolio company; the enrichment pass
  confirmed no live developer surface exists.
